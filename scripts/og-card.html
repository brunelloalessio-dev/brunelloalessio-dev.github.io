<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>OG Card 1200×630</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #09090b;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #fafafa;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 470px 1fr;
        background: #09090b;
        overflow: hidden;
      }
      .photo {
        position: relative;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 22%;
        display: block;
      }
      .photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 55%, #09090b 98%);
      }
      .copy {
        position: relative;
        padding: 58px 60px 48px 36px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a1a1aa;
      }
      h1 {
        margin-top: 16px;
        font-size: 64px;
        line-height: 0.95;
        letter-spacing: -0.05em;
        font-weight: 800;
      }
      .role {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .role span {
        display: block;
        margin-top: 4px;
        font-weight: 500;
        color: #a1a1aa;
        font-size: 18px;
      }
      ul {
        list-style: none;
        margin-top: 28px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      li {
        display: flex;
        align-items: baseline;
        gap: 12px;
        font-size: 17px;
        color: #d4d4d8;
      }
      li b {
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.03em;
        min-width: 64px;
      }
      .url {
        margin-top: 32px;
        font-size: 15px;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="card" id="og-card">
      <div class="photo">
        <img src="../public/photo.jpg" alt="Alessio Brunello" />
      </div>
      <div class="copy">
        <div class="eyebrow">Portfolio · Bludata</div>
        <h1>Alessio<br />Brunello</h1>
        <p class="role">
          Frontend Tech Lead
          <span>AI-augmented delivery</span>
        </p>
        <ul>
          <li><b>10+</b> anni su prodotti web e mobile</li>
          <li><b>~80%</b> del frontend, design system</li>
          <li><b>2×</b> delivery, qualità tenuta alta</li>
        </ul>
        <div class="url">brunelloalessio-dev.github.io</div>
      </div>
    </div>
  </body>
</html>
