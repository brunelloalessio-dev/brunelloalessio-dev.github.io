<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>OG Card 1200×630</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #111;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: #09090b;
        color: #fafafa;
      }
      .glow-a {
        position: absolute;
        width: 520px;
        height: 520px;
        left: -120px;
        top: -160px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        filter: blur(80px);
      }
      .glow-b {
        position: absolute;
        width: 480px;
        height: 480px;
        right: -80px;
        bottom: -180px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        filter: blur(90px);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at 40% 50%, black 20%, transparent 70%);
        opacity: 0.5;
      }
      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        padding: 64px 72px;
        gap: 40px;
        align-items: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #18181b;
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.02em;
      }
      .brand-name {
        font-size: 18px;
        font-weight: 500;
        color: #a1a1aa;
        letter-spacing: 0.01em;
      }
      h1 {
        font-size: 64px;
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin-bottom: 18px;
      }
      .role {
        font-size: 28px;
        font-weight: 500;
        color: #d4d4d8;
        letter-spacing: -0.02em;
        margin-bottom: 28px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .tag {
        font-size: 15px;
        color: #a1a1aa;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
        padding: 8px 14px;
      }
      .photo-wrap {
        justify-self: end;
        align-self: center;
        position: relative;
        /* Same aspect as photo.jpg (644×1220) so nothing is cropped */
        width: 264px;
        height: 500px;
      }
      .photo-ring {
        position: absolute;
        inset: -10px;
        border-radius: 36px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .photo-aura {
        position: absolute;
        inset: -24px;
        border-radius: 48px;
        background: rgba(255, 255, 255, 0.08);
        filter: blur(28px);
      }
      .photo-frame {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 28px;
        border: 2px solid rgba(255, 255, 255, 0.14);
        background: #09090b;
      }
      .photo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }
      .url {
        position: absolute;
        left: 72px;
        bottom: 48px;
        z-index: 1;
        font-size: 16px;
        color: #71717a;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="card" id="og-card">
      <div class="glow-a"></div>
      <div class="glow-b"></div>
      <div class="grid"></div>
      <div class="content">
        <div>
          <div class="brand">
            <div class="mark">AB</div>
            <div class="brand-name">Portfolio</div>
          </div>
          <h1>Alessio Brunello</h1>
          <p class="role">Frontend Tech Lead</p>
          <div class="tags">
            <span class="tag">React</span>
            <span class="tag">TypeScript</span>
            <span class="tag">UI Architecture</span>
            <span class="tag">AI Engineering</span>
          </div>
        </div>
        <div class="photo-wrap">
          <div class="photo-aura"></div>
          <div class="photo-ring"></div>
          <div class="photo-frame">
            <img
              class="photo"
              src="../public/photo.jpg"
              alt="Alessio Brunello"
            />
          </div>
        </div>
      </div>
      <div class="url">brunelloalessio-dev.github.io</div>
    </div>
  </body>
</html>
